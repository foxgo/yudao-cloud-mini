name: Refactor Java namespace

on:
  push:
    branches:
      - refactor/foxgo-package-namespace

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v7
        with:
          ref: refactor/foxgo-package-namespace
          fetch-depth: 0

      - name: Rewrite Java package namespace and Maven coordinates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys

          OLD_PACKAGE = "cn.iocoder.yudao"
          NEW_PACKAGE = "com.foxgo.platform"
          OLD_GROUP = "cn.iocoder.cloud"
          NEW_GROUP = "com.foxgo.platform"
          OLD_PATH = "cn/iocoder/yudao"
          NEW_PATH = "com/foxgo/platform"
          WORKFLOW_PATH = ".github/workflows/refactor-package-namespace.yml"

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          tracked = [p for p in tracked if p]
          changed_content = 0
          moved_paths = 0
          skipped_binary = 0

          for rel in tracked:
              if rel == WORKFLOW_PATH:
                  continue
              path = Path(rel)
              if not path.is_file():
                  continue

              raw = path.read_bytes()
              if b"\0" in raw:
                  skipped_binary += 1
              else:
                  try:
                      raw.decode("utf-8")
                  except UnicodeDecodeError:
                      skipped_binary += 1
                  else:
                      updated = raw.replace(OLD_PACKAGE.encode(), NEW_PACKAGE.encode())
                      updated = updated.replace(OLD_GROUP.encode(), NEW_GROUP.encode())
                      updated = updated.replace(OLD_PATH.encode(), NEW_PATH.encode())
                      if updated != raw:
                          path.write_bytes(updated)
                          changed_content += 1

              if OLD_PATH in rel:
                  target_rel = rel.replace(OLD_PATH, NEW_PATH)
                  target = Path(target_rel)
                  if target.exists():
                      raise SystemExit(f"Refusing to overwrite existing target: {target_rel}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  os.replace(path, target)
                  moved_paths += 1

          # Remove this one-shot workflow from the resulting source branch.
          workflow = Path(WORKFLOW_PATH)
          if workflow.exists():
              workflow.unlink()

          leftovers = subprocess.run(
              ["git", "grep", "-nE", r"cn\\.iocoder\\.yudao|cn\\.iocoder\\.cloud|cn/iocoder/yudao"],
              text=True, capture_output=True
          )
          if leftovers.returncode == 0:
              print(leftovers.stdout[:12000])
              raise SystemExit("Legacy package/group namespace remains in tracked text files")

          all_files = subprocess.check_output(["git", "ls-files", "-co", "--exclude-standard", "-z"]).decode().split("\0")
          java_files = [p for p in all_files if p.endswith(".java") and p]
          new_package_files = 0
          for rel in java_files:
              try:
                  content = Path(rel).read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              if "package com.foxgo.platform" in content:
                  new_package_files += 1

          print(f"Content files updated: {changed_content}")
          print(f"Package paths moved: {moved_paths}")
          print(f"Binary/non-UTF8 files skipped: {skipped_binary}")
          print(f"Java files: {len(java_files)}; new namespace package declarations: {new_package_files}")

          if moved_paths == 0 or new_package_files == 0:
              raise SystemExit("Unexpectedly low refactor count; aborting commit")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: migrate namespace to com.foxgo.platform"
          git push origin HEAD:refactor/foxgo-package-namespace

      - name: Resolve JDK version from root pom
        id: jdk
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          value = (ET.parse("pom.xml").getroot().findtext("m:properties/m:java.version", namespaces=ns) or "").strip().removeprefix("1.")
          if not value.isdigit():
              raise SystemExit(f"Invalid java.version in root pom.xml: {value!r}")
          print(f"version={value}")
          PY

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ steps.jdk.outputs.version }}
          distribution: temurin
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Build with Maven
        run: mvn -B package --file pom.xml -Dmaven.test.skip=true
